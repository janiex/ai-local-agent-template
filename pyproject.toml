[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-template"
version = "0.1.0"
description = "A minimal, extensible framework for LLM agents that use skills (local or external LLM)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Only needed when using the external Claude API backend.
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.0"]

[project.scripts]
ai-agent = "ai_agent_template.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_agent_template*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
